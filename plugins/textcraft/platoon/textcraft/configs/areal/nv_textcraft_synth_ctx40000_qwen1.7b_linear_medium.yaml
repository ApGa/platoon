experiment_name: recursive-agents
trial_name: textcraft-synth-nv-ctx40000-qwen1.7b-linear-medium-trial-1

seed: 343
total_train_epochs: 10
tokenizer_path: ${actor.path}

train_difficulties: ["medium"]
eval_difficulties: null
depth_aware: false
#enable_offload: false

cluster:
  n_nodes: 1  
  n_gpus_per_node: 8
  fileroot: /lustre/fsw/portfolios/nvr/projects/nvr_lacr_llm/users/apurvag/experiments/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /lustre/fsw/portfolios/nvr/projects/nvr_lacr_llm/users/apurvag/experiments/areal/name_resolve

rollout:
  backend: sglang:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  scheduling_spec: ${actor.scheduling_spec}
  setup_timeout: 900
  max_concurrent_rollouts: 8
  queue_size: null 
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 3
  enable_rollout_tracing: false
  #shuffle_cross_task: true
  #ensure_batch_divisible_by: 4

workflow_config:
  rollout_config:
    model_name: ${actor.path}
    max_steps: 200
    output_dir: /lustre/fsw/portfolios/nvr/projects/nvr_lacr_llm/users/apurvag/experiments/areal/experiments/textcraft-synth-nv-ctx40000-qwen1.7b-linear-medium-trial-1
    verbose: true
    train: true
    timeout: 7200
    inference_params:
      temperature: 1.0
      max_completion_tokens: 512
    step_timeout: 7200
    propogate_root_success: false
    skip_subagent_reward_computation: false
  filter_zero_variance_groups: false
  group_size: 8
  leave_one_out_baseline: false  # Use leave-one-out baseline for advantage centering
  depth_level_weighting: false  # Weight trajectories inversely by depth-level frequency
  depth_level_discount_gamma: null  # Alternate strategy: discount rewards by trajectory depth as gamma^d

# CISPO loss function configuration (matches tinker settings)
loss_fn_config:
  loss_fn: cispo
  loss_fn_kwargs:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0

actor:
  backend: fsdp:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: adityasoni17/Qwen3-1.7B-Instruct
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 40000
  optimizer:
    type: adam
    lr: 3e-6
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python -m areal.infra.rpc.rpc_server
      env_vars: {}
  eps_clip: 0.2
  eps_clip_higher: 0.26
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  kl_estimator: k1
  ppo_n_minibatches: 1
  recompute_logprob: false #true
  use_decoupled_loss: false #true
  reward_norm:
    mean_level: null
    std_level: null
  adv_norm:
    mean_level: null
    std_level: null

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 40000
  optimizer: null

  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}
# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 40001
  mem_fraction_static: 0.8
  #attention_backend: flashinfer # Uncomment for blackwell GPUs

# datasets
train_dataset:
  batch_size: 16

valid_dataset:
  batch_size: 50

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 25
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 5
  freq_secs: 1500

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: online
    project: recursive-agents

