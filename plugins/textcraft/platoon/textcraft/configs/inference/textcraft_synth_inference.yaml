# TextCraft-Synth inference benchmark config.
inference:
  model_name: openai/qwen3-ctx40000-cispo-4b-recursive-medium
  model_endpoint: http://127.0.0.1:30000/v1
  model_api_key: null
  output_dir: ./inference_results/textcraft_synth/qwen3-ctx40000extended-step800-heuristicv1-cispo-4b-recursive-medium
  resume: true
  workflow:
    num_rollouts_per_task: 1
    num_concurrent_workers: 16
    success_threshold: 1.0
    fail_fast: false
    use_subprocesses: false
    subprocess_max_workers: null
    rollout_config:
      max_steps: 800
      output_dir: ./inference_results/textcraft_synth/qwen3-ctx40000extended-step800-heuristicv1-cispo-4b-recursive-medium/rollouts
      verbose: true
      timeout: 1200
      step_timeout: 300
      use_subagent_step_heuristic: true
      inference_params:
        temperature: 0.0
        top_p: null
        max_completion_tokens: 512

dataset_split: val
difficulty: null
num_tasks: 100
use_recursive_agent: true
task_id: null
# full: run rollouts + report
# rollouts: only write rollouts to disk (resume-friendly)
# report: only read existing rollouts and generate report
stage: full
shuffle_tasks: false
seed: 42
