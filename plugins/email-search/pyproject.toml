[project]
name = "platoon-email-search"
version = "0.1.0"
description = "Platoon plugin for email-search deep-research tasks."
requires-python = "~=3.12.0"
authors = [
    {name = "Apurva Gandhi", email = "apurvag@cs.cmu.edu"}
]
dependencies = [
    "platoon >= 0.1.0",
    "datasets >= 2.0.0",
    "tqdm >= 4.67.0",
]

[project.optional-dependencies]
tinker = [
    "platoon[tinker]",
]
areal = [
    "platoon[areal]",
]
wandb = [
    "platoon[wandb]",
]

[tool.uv]
conflicts = [
    [
        { extra = "tinker" },
        { extra = "areal" },
    ],
]
override-dependencies = [
    "fastapi[standard]>=0.115.0",
    "openai==1.99.6",
    "xgrammar==0.1.24",
    "outlines-core==0.1.26",
    "pyarrow==20.0.0",
    "transformers>=5.3.0",
    "datasets==4.3.0",
    "networkx==3.3.0",
    "megatron-core==0.16.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "hydra-core==1.4.0.dev1",
    "nvidia-cudnn-cu12==9.16.0.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-resiliency-ext~=0.4.1",
    "soundfile>=0.12.1,<0.13.0",
    "timm==1.0.16",
]
no-build-isolation-package = ["flash-attn", "causal-conv1d", "mamba-ssm"]

[tool.uv.sources]
platoon = { path = "../..", editable = true }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platoon"]
