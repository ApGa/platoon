experiment_name: codescout-grpo
trial_name: trial1

cluster:
  n_nodes: 1
  n_gpus_per_node: 6
  fileroot: /scratch/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /scratch/areal/name_resolve

allocation_mode: sglang:d2p1t1+d4p1t1
seed: 42
# enable_offload: false
total_train_epochs: 1
tokenizer_path: ${actor.path}
gconfig:
  n_samples: 8
  min_new_tokens: 0
  max_new_tokens: 8192
  greedy: false
  temperature: 1.0

workflow_config:
  rollout_config:
    model_name: ${actor.path}
    max_steps: 6
    output_dir: /scratch/areal/experiments/codescout-grpo-trial1
    verbose: True
    train: true
    timeout: 600
  group_size: 8

rollout:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 32
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 3
  enable_rollout_tracing: false

actor:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: adityasoni17/Qwen3-1.7B-RFT-500
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768
  optimizer:
    type: adam
    lr: 1e-6
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.0003
  eps_clip_higher: 0.0004
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  kl_estimator: k1
  importance_sampling_level: sequence
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: false
  behav_imp_weight_cap: null
  dynamic_sampling: false
  reward_norm:
    mean_level: group
    std_level: group
    group_size: ${gconfig.n_samples}
  adv_norm:
    mean_level: batch
    std_level: batch
  max_new_tokens: ${gconfig.max_new_tokens}

ref:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 40000
  optimizer: null

train_dataset:
  type: rl
  batch_size: 8
  path: ""

valid_dataset:
  batch_size: 8
  type: rl
  path: ""

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 10
  freq_secs: null

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: online
    project: swe-grpo-platoon

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 5
  freq_steps: null
  freq_secs: 3600

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 40000
  mem_fraction_static: 0.8

launcher:
  inference_server_cpus_per_gpu: 1
  inference_server_mem_per_gpu: 38000
  trainer_cpus_per_gpu: 1
  trainer_mem_per_gpu: 40000