# Oolong inference benchmark config.
inference:
  model_name: openai/Qwen/Qwen3-4B-Instruct-2507
  model_endpoint: http://127.0.0.1:30000/v1 #uv run --extra areal -m sglang.launch_server --model-path Qwen/Qwen3-4B-Instruct-2507 --dp 8 --context-length 70000
  model_api_key: null
  output_dir: /tmp/oolong_both_qwen_4b_recursive
  resume: true
  workflow:
    num_rollouts_per_task: 1
    num_concurrent_workers: 10
    success_threshold: 1.0
    fail_fast: false
    use_subprocesses: false
    subprocess_max_workers: null
    rollout_config:
      max_steps: 50
      output_dir: /tmp/oolong_both_qwen_4b_recursive/rollouts
      verbose: true
      timeout: 3600
      step_timeout: 3600
      inference_params:
        temperature: 1.0
        top_p: null
        max_completion_tokens: 8192
    

# Dataset configuration
oolong_dataset: both   # synth, real, or both
dataset_split: validation  # validation or test
num_tasks: 10
use_recursive_agent: true
task_id: null
# Filtering options (null means no filter)
task_group: null   # counting, user, or timeline
answer_type: null  # NUMERIC, LABEL, COMPARISON, USER, MONTH_YEAR
min_context_len: null
max_context_len: 240000
# full: run rollouts + report
# rollouts: only write rollouts to disk (resume-friendly)
# report: only read existing rollouts and generate report
stage: full
shuffle_tasks: true
seed: 42
