# Oolong recursive training configuration for Tinker

train:
  model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16 #Qwen/Qwen3.5-35B-A3B
  renderer_name: nemotron3_disable_thinking #qwen3_5_disable_thinking
  renderer_kwargs:
    strip_thinking_from_history: false
  batch_size: 16
  num_epochs: 10
  max_training_steps: 100
  num_minibatches: 1
  num_microbatches: 4
  max_staleness: 3
  lora_rank: 32
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 3e-5
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    grad_clip_norm: 1e12
  workflow_config:
    group_size: 8
    leave_one_out_baseline: true
    depth_level_weighting: true
    rollout_config:
      max_steps: 15
      output_dir: ./rollout_results
      verbose: true
      timeout: 3600
      step_timeout: 3600
      inference_params:
        temperature: 1.0
        max_completion_tokens: 4096
  num_concurrent_rollout_workflow_workers: 4

eval:
  strategy: step
  every: 20
  num_concurrent_rollout_workflow_workers: 8
  workflow_config:
    group_size: 1
    rollout_config:
      max_steps: 15
      output_dir: ./eval_results
      verbose: false
      timeout: 3600
      step_timeout: 3600
      inference_params:
        temperature: 1.0
        max_completion_tokens: 4096

checkpoint:
  strategy: step
  every: 5
  load_checkpoint_path: null

log_path: ./logs/runs
tinker_base_url: null

watchdog:
  timeout_seconds: 7200

stats:
  experiment_name: recursive-agents
  trial_name: oolong-real-nemotron3-nano-30b-a3b-bf16-recursive-tinker-trial-1
  wandb:
    mode: online
    project: recursive-agents
    entity: null
    tags:
      - oolong
      - tinker
      - recursive

recursive: true
seed: 343
oolong_dataset: real
task_group: null
answer_type: null
min_context_len: null
max_context_len: 240000
