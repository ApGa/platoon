# Oolong linear training configuration for Tinker

train:
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct
  batch_size: 16
  num_epochs: 10
  max_training_steps: 100
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 3
  lora_rank: 32
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 3e-5
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    grad_clip_norm: 1e12
  workflow_config:
    group_size: 8
    leave_one_out_baseline: false
    depth_level_weighting: false
    rollout_config:
      max_steps: 200
      output_dir: ./rollout_results
      verbose: true
      timeout: 3600
      step_timeout: 3600
      inference_params:
        temperature: 1.0
        max_completion_tokens: 8192
  num_concurrent_rollout_workflow_workers: 16

eval:
  strategy: step
  every: 20
  num_concurrent_rollout_workflow_workers: 16
  workflow_config:
    group_size: 1
    rollout_config:
      max_steps: 200
      output_dir: ./eval_results
      verbose: false
      timeout: 3600
      step_timeout: 3600
      inference_params:
        temperature: 1.0
        max_completion_tokens: 8192

checkpoint:
  strategy: step
  every: 5
  load_checkpoint_path: null

log_path: ./logs/runs
tinker_base_url: null

watchdog:
  timeout_seconds: 3600

stats:
  experiment_name: recursive-agents
  trial_name: oolong-real-qwen-4b-linear-tinker-trial-0
  wandb:
    mode: online
    project: recursive-agents
    entity: null
    tags:
      - oolong
      - tinker
      - linear

recursive: false
seed: 343
oolong_dataset: real
task_group: null
answer_type: null
min_context_len: null
max_context_len: 240000
