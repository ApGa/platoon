experiment_name: recursive-agents
trial_name: appworld-ctx40000-cispo-4b-linear-trial-2

seed: 343
total_train_epochs: 100
tokenizer_path: ${actor.path}

workflow_spec:
  registry_modules:
    - platoon.appworld.registry
  task_loader: appworld.task_loader
  get_task: appworld.get_task
  rollout_fn: appworld.rollout
  reward_processor: appworld.reward_processor

recursive: false

cluster:
  n_nodes: 1  
  n_gpus_per_node: 8
  fileroot: /mnt/efs/tmp/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /mnt/efs/tmp/areal/name_resolve

rollout:
  backend: sglang:d4p1t1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  max_concurrent_rollouts: 16
  queue_size: null 
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 3
  enable_rollout_tracing: false

workflow_config:
  rollout_config:
    model_name: ${actor.path}
    max_steps: 75
    output_dir: /mnt/efs/tmp/areal/experiments/appworld-ctx40000-cispo-4b-linear-trial-2
    verbose: True
    train: true
    timeout: 900
    step_timeout: 600
    inference_params:
        temperature: 1.0
        max_completion_tokens: 2048
  group_size: 8
  use_subprocesses: true

# CISPO loss function configuration (matches tinker settings)
loss_fn_config:
  loss_fn: cispo
  clip_low_threshold: 0.0
  clip_high_threshold: 5.0

actor:
  backend: fsdp:d4p1t1c1
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: /mnt/efs/LlamaFactory/saves/appworld-sft-qwen3-4b-linear_opus_4_5_v2
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 60000 #40000 
  optimizer:
    type: adam
    lr: 3e-6
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.2
  eps_clip_higher: 0.26
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  kl_estimator: k1
  ppo_n_minibatches: 1
  recompute_logprob: false #true
  use_decoupled_loss: false #true
  reward_norm:
    mean_level: null
    std_level: null
  adv_norm:
    mean_level: null
    std_level: null

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 4000
  optimizer: null

# SGLang
sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 40001
  mem_fraction_static: 0.8
  #attention_backend: flashinfer # Uncomment for blackwell GPUs

# datasets
train_dataset:
  batch_size: 16

valid_dataset:
  batch_size: 50

# Utilities
saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 25
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 5
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 5
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: online
    project: recursive-agents

