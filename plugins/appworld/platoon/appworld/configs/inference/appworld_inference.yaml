# AppWorld inference benchmark config.
inference:
  model_name: litellm_proxy/neulab/claude-opus-4-5-20251101
  model_endpoint: https://cmu.litellm.ai
  model_api_key: null
  output_dir: ./inference_results/appworld/claude-opus-4-5-20251101-linear
  resume: true
  workflow:
    num_rollouts_per_task: 1
    num_concurrent_workers: 4
    success_threshold: 1.0
    fail_fast: false
    use_subprocesses: true
    subprocess_max_workers: 10
    rollout_config:
      max_steps: 75
      output_dir: ./inference_results/appworld/claude-opus-4-5-20251101-linear/rollouts
      verbose: true
      timeout: 1800
      step_timeout: 1800
      codeact_inference_params:
        temperature: 0.7
        max_completion_tokens: 2048

dataset_split: train
num_tasks: 90
use_recursive_agent: false
task_id: null
# full: run rollouts + report
# rollouts: only write rollouts to disk (resume-friendly)
# report: only read existing rollouts and generate report
stage: full
shuffle_tasks: false
seed: 42
