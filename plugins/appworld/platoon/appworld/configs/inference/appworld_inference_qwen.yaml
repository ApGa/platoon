# AppWorld inference benchmark config.
inference:
  model_name: openai/OpenPipe/Qwen3-14B-Instruct #openai/Qwen3-4B-Instruct-2507
  model_endpoint: http://127.0.0.1:30000/v1
  model_api_key: null
  output_dir: ./inference_results/appworld/qwen3-14b-recursive
  resume: true
  workflow:
    num_rollouts_per_task: 1
    num_concurrent_workers: 32
    success_threshold: 1.0
    fail_fast: false
    use_subprocesses: true
    subprocess_max_workers: 10
    rollout_config:
      max_steps: 75
      output_dir: ./inference_results/appworld/qwen3-14b-recursive/rollouts
      verbose: true
      timeout: 1800
      step_timeout: 1800
      inference_params:
        temperature: 1.0
        max_completion_tokens: 2048

dataset_split: train
num_tasks: 90
use_recursive_agent: true
task_id: null
# full: run rollouts + report
# rollouts: only write rollouts to disk (resume-friendly)
# report: only read existing rollouts and generate report
stage: full
shuffle_tasks: false
seed: 42
