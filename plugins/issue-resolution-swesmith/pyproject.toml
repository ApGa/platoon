[project]
name = "issue-resolution-swesmith"
version = "0.1.0"
description = "Platoon plugin for training LLM agents with RL for issue resolution in GitHub repositories."
requires-python = "~=3.12.0"
authors = [
    {name = "Aditya Bharat Soni", email = "adityabs@cs.cmu.edu"}
]
dependencies = [
    "platoon >= 0.1.0",
    "platoon-openhands >= 0.1.0",
    "openhands-sdk",
    "openhands-tools",
    "openhands-workspace",
    "openhands-agent-server",
    "unidiff",
    "swesmith",
    "swebench",
    "modal",
    "libcst == 1.5.0"
]
[project.optional-dependencies]
# Training backends - install one of these for training
tinker = [
    "platoon[tinker]",
]
# Logging integrations
wandb = [
    "platoon[wandb]",
]
# uv-specific configuration
[tool.uv]
# tinker and areal backends are mutually exclusive
conflicts = [
    [
        { extra = "tinker" },
        { extra = "areal" },
    ],
]
override-dependencies = [
    "fastapi[standard]>=0.115.0",
    "openai>=2.8.0",
    "networkx==3.3.0"
]
[tool.uv.sources]
platoon = { path = "../..", editable = true }
platoon-openhands = { path = "../openhands", editable = true }
openhands-sdk = { git = "https://github.com/OpenHands/software-agent-sdk.git", rev = "43376f1868ffd702746080714a59c16d3f69ec12", subdirectory = "openhands-sdk" }
openhands-tools = { git = "https://github.com/OpenHands/software-agent-sdk.git", rev = "43376f1868ffd702746080714a59c16d3f69ec12", subdirectory = "openhands-tools" }
openhands-workspace = { git = "https://github.com/OpenHands/software-agent-sdk.git", rev = "43376f1868ffd702746080714a59c16d3f69ec12", subdirectory = "openhands-workspace" }
openhands-agent-server = { git = "https://github.com/OpenHands/software-agent-sdk.git", rev = "43376f1868ffd702746080714a59c16d3f69ec12", subdirectory = "openhands-agent-server" }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["platoon"]