[project]
name = "platoon-openreward"
version = "0.1.0"
description = "Platoon plugin for training OpenHands agents on OpenReward environments."
requires-python = "~=3.12.0"
authors = [
    {name = "Apurva Gandhi", email = "apurvag@cs.cmu.edu"}
]
dependencies = [
    "mcp>=1.0.0",
    # 0.1.43 introduced the scalable num_tasks/get_task client API used for
    # large task catalogs and mixed-environment routing.
    "openreward>=0.1.43",
    "platoon >= 0.1.0",
    "platoon-openhands >= 0.1.0",
]

[project.optional-dependencies]
# Training backends - install one of these for training
tinker = [
    "platoon[tinker]",
]
# NOTE: areal backend requires uv for installation (not available on PyPI)
areal = [
    "platoon[areal]",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# tinker and areal backends are mutually exclusive
conflicts = [
    [
        { extra = "tinker" },
        { extra = "areal" },
    ],
]
override-dependencies = [
    # Force the OpenHands SDK stack from ApGa/openhands-agent-sdk with
    # programmatic tool calling and declared-resource concurrency support. This
    # is a hard override:
    # areal's litellm[proxy]/swanboard pin rich<14, but openhands-tools'
    # browser-use needs rich>=14, so we force rich 14.x (overriding litellm's pin).
    "openhands-sdk==1.29.0",
    "openhands-tools==1.29.0",
    "openhands-workspace==1.29.0",
    "openhands-agent-server==1.29.0",
    "rich==14.3.1",
    # Mirror AReaL HEAD's own override-dependencies; uv only honours overrides from the
    # root project, so each lockable project must re-declare them. Plain pins (fastapi,
    # datasets, wandb, ...) live in platoon's [project.dependencies] and arrive transitively.
    "openai>=2.8.0",
    "soundfile>=0.12.1,<0.13.0",
    "torchao==0.15.0",
    "flash-attn-4>=4.0.0b4",
    "transformers>=5.0.0,<=5.3.0",
    "nvidia-cudnn-cu12==9.16.0.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "networkx==3.3.0",  # areal pins 3.3 but ai-rubric needs >=3.5.0; force areal's pin.
    "megatron-core==0.17.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "hydra-core==1.4.0.dev1",
    "timm==1.0.16",
    # Optional CUDA-only megatron deps excluded from resolution by AReaL; mirror
    # that. The Megatron backend needs Transformer Engine at runtime, but TE's
    # torch bindings are sdist-only and don't build on the compute nodes (no CUDA
    # toolkit / ninja), which would break `uv sync` for FSDP too; provide TE via
    # the container for Megatron. FSDP runs don't need TE (lazy import).
    "transformer-engine; sys_platform == 'never'",
    "nv-grouped-gemm; sys_platform == 'never'",
    "mamba-ssm; sys_platform == 'never'",
    "causal-conv1d; sys_platform == 'never'",
    "nvidia-resiliency-ext; sys_platform == 'never'",
    # NOTE: swanlab/swanboard are NOT excluded: areal.utils.stats_logger imports
    # swanlab unconditionally. They pin rich<14, but the rich==14.3.1 override
    # above forces rich 14 anyway so swanlab and openhands' browser-use (rich>=14)
    # coexist. Platoon logs via wandb, so swanlab is import-only at runtime.
]
no-build-isolation-package = ["flash-attn", "causal-conv1d", "mamba-ssm"]

[tool.uv.sources]
platoon = { path = "../..", editable = true }
platoon-openhands = { path = "../openhands", editable = true }

[tool.uv.sources.openhands-sdk]
git = "https://github.com/ApGa/openhands-agent-sdk.git"
rev = "d2677bf750ab202efc2808a2b05d4dcd8efa98b5"
subdirectory = "openhands-sdk"

[tool.uv.sources.openhands-tools]
git = "https://github.com/ApGa/openhands-agent-sdk.git"
rev = "d2677bf750ab202efc2808a2b05d4dcd8efa98b5"
subdirectory = "openhands-tools"

[tool.uv.sources.openhands-workspace]
git = "https://github.com/ApGa/openhands-agent-sdk.git"
rev = "d2677bf750ab202efc2808a2b05d4dcd8efa98b5"
subdirectory = "openhands-workspace"

[tool.uv.sources.openhands-agent-server]
git = "https://github.com/ApGa/openhands-agent-sdk.git"
rev = "d2677bf750ab202efc2808a2b05d4dcd8efa98b5"
subdirectory = "openhands-agent-server"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platoon"]
