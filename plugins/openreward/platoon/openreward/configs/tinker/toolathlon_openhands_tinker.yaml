# OpenReward Toolathlon + OpenHands Tinker training configuration.

train:
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct
  batch_size: 8
  num_epochs: 10
  max_training_steps: 100
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 3
  lora_rank: 32
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 3e-5
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    grad_clip_norm: 1e12
  workflow_config:
    group_size: 4
    leave_one_out_baseline: true
    rollout_config:
      max_steps: 100
      output_dir: ./rollout_results/openreward_toolathlon_tinker
      verbose: true
      timeout: 1800
      step_timeout: 600
      inference_params:
        temperature: 1.0
        max_completion_tokens: 4096
  num_concurrent_rollout_workflow_workers: 8

eval:
  strategy: step
  every: 20
  num_concurrent_rollout_workflow_workers: 8
  workflow_config:
    group_size: 1
    rollout_config:
      max_steps: 100
      output_dir: ./eval_results/openreward_toolathlon_tinker
      verbose: false
      timeout: 1800
      step_timeout: 600
      inference_params:
        temperature: 0.7
        max_completion_tokens: 4096

checkpoint:
  strategy: step
  every: 10
  load_checkpoint_path: null

log_path: ./data/user_data/apurvag/platoon/runs/logs
tinker_base_url: null

stats:
  experiment_name: openreward-openhands-tinker
  trial_name: toolathlon-trial0
  wandb:
    mode: disabled
    project: openreward-openhands-tinker
    entity: null
    tags:
      - openreward
      - toolathlon
      - openhands
      - tinker

openreward:
  env_name: toolathlongym
  split: train
  eval_split: train
  session_url: http://localhost:8080
  api_url: null
  api_key: local
  train_task_limit: null
  eval_task_limit: 50
  task_names: null
  max_tool_calls: 0
  enable_programmatic_tool_calling: false
  enable_recursive_subagents: false
  subagent_default_max_steps: 50
  subagent_max_depth: null
  openhands_system_prompt_suffix: null

seed: 42
