# OpenReward Toolathlon + OpenHands on the miles-tinker gateway (15 x H200 nodes:
# 4 Megatron full-finetune nodes + 11 SGLang TP8 engines), Qwen3.6-35B-A3B,
# NON-recursive (no subagents, no programmatic tool calling), partial rewards,
# rollout routing replay (R3) and fp32 lm head on both sides. Two-key delta from
# the recursive yaml (precedent: ..._16node_nonrecursive_..._v10_padded.yaml:35-37);
# the judging flags stay true because they never fire without launch_subagent.
#
# Translated (not copied) from the AReaL v35 config
# configs/areal/..._15node_recursive_h200_qwen36_moe_cp2_c24_s3_v35_behavior_usage_gated_partial.yaml.
# load_config drops unknown keys silently, so every key below maps to a field
# of OpenRewardTinkerTrainerConfig (tests/test_tinker_toolathlon_configs.py
# walks this file and asserts it). AReaL-only keys deliberately NOT carried over:
#   workflow_config.use_subprocesses, subprocess_shutdown_grace_seconds,
#   filter_zero_variance_groups, depth_level_discount_gamma,
#   token_efficiency_reward, dynamic_batch_recollection_max_rounds,
#   enable_router_replay / router_replay_*, rollout.*, actor.*, ref, sglang.*,
#   saver / recover / evaluator, cluster, scheduler.
# Tinker analogues: rollout.max_head_offpolicyness -> train.max_staleness,
# rollout.max_concurrent_rollouts -> train.num_concurrent_rollout_workflow_workers
# (task-level: workers x group_size trajectories), engine_max_tokens ->
# train.context_window_length. R3 rides on Datum.loss_fn_inputs["routing_handle"]
# (gateway flag --use-rollout-routing-replay), not on a config key.
# CISPO normalization matches v35: both paths zero the loss mask for suppressed
# (positive-advantage) error tokens before the token-mean denominator
# (tinker/workflows/group_rollout_workflow.py:_filter_positive_centered_error_tokens
# -> get_loss_normalization_token_count sums mask; AReaL loss_mask_count).

train:
  model_name: apurvaga/Qwen3.6-35B-A3B-preserve-thinking
  renderer_name: qwen3_6_preserve_thinking
  renderer_kwargs:
    preserve_thinking: true
    enable_thinking: true
  context_window_length: 65536
  batch_size: 8
  num_epochs: 10
  max_training_steps: null
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 3
  lora_rank: 32                           # ignored by the full-finetune gateway (SDK needs rank > 0)
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 3.0e-6
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.017
    grad_clip_norm: 1.0
  workflow_config:
    group_size: 8
    leave_one_out_baseline: true
    depth_level_weighting: true
    subagent_datum_keep_probability: 1.0  # keep all subagent datums (v35: 0.25)
    subagent_datum_sampling_seed: 343
    filter_errors: true
    filter_zero_advantage_datums: false
    straggler_timeout_seconds: 900
    straggler_quorum: 6
    min_successful_group_size: 4
    rollout_config:
      max_steps: 200
      timeout: 3600
      step_timeout: 2700
      propagate_root_success: false
      verbose: true
      inference_params:
        temperature: 1.0
        top_p: 1.0
        max_completion_tokens: 4096
  # Task-level: 3 x 8 = 24 concurrent trajectories = v35 parity; the client
  # launcher overrides this with WORKERS (ramp 3 -> 6 -> 12).
  num_concurrent_rollout_workflow_workers: 3

eval:
  strategy: none
  every: 0
  num_concurrent_rollout_workflow_workers: 1
  workflow_config:
    group_size: 1
    filter_errors: false
    filter_zero_advantage_datums: false
    rollout_config:
      max_steps: 200
      timeout: 3600
      step_timeout: 2700
      inference_params:
        temperature: 1.0
        max_completion_tokens: 4096

# ~490 GB per save_state. AReaL-style two-tier cadence: `every: 20` writes a
# permanent checkpoint (name `<batch>`) that is kept forever (~15 h apart at
# 45-min steps), and `recovery_every: 1` writes a full weights+optimizer
# checkpoint (name `recovery-<batch>`) after every other step, so a crash loses
# at most one step. Each (re)launch also writes `recovery-<start_batch>`. The
# client-side pruner keeps only the newest 2 recovery checkpoints (plus the
# resume point) and every permanent one.
checkpoint:
  strategy: step
  every: 20
  recovery_every: 1
  load_checkpoint_path: null

log_path: /groups/gai51740/aci18912it/miles-tinker/runs/default/logs   # overridden by --log_path
tinker_base_url: null                     # --tinker_base_url; the proxy also needs env TINKER_BASE_URL

watchdog:
  enabled: true
  timeout_seconds: 7200
  exit_code: 2

stats:
  experiment_name: toolathlon-openhands-miles-tinker
  trial_name: abci-ta15-nonrec-q36m-tp1ep8dp32-c3-s3-d2-behavior-usage-partial-r3-fp32-v1
  wandb:
    mode: online
    project: toolathlon-openhands
    entity: null
    group: abci-ta15-nonrec-q36m-miles-tinker-r3-fp32-v1
    tags:
      - openreward
      - toolathlon
      - openhands
      - tinker
      - miles-tinker
      - qwen36
      - r3
      - nonrecursive

