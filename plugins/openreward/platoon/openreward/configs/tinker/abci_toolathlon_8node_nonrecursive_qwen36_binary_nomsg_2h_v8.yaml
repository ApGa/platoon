# Two-hour episode and step limits; four-hour no-progress watchdog.
# Toolathlon reward ablation: nonrecursive, binary root rewards.
# 8 H200 nodes: 2 training + 6 inference/environment nodes.
# Launch with OPENREWARD_REWARD_MODE=binary; message endings receive zero reward and train normally.
# Keep full strict R3 capture and FA3; deterministic inference remains disabled.

train:
  model_name: apurvaga/Qwen3.6-35B-A3B-preserve-thinking
  renderer_name: qwen3_6_preserve_thinking
  renderer_kwargs:
    preserve_thinking: true
    enable_thinking: true
  context_window_length: 65536
  batch_size: 8
  num_epochs: 10
  max_training_steps: null
  num_minibatches: 1
  num_microbatches: 1
  max_staleness: 3
  lora_rank: 32                           # ignored by the full-finetune gateway (SDK needs rank > 0)
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 3.0e-6
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.017
    grad_clip_norm: 1.0
  workflow_config:
    group_size: 8
    rollout_isolation: process
    leave_one_out_baseline: true
    depth_level_weighting: true
    subagent_datum_keep_probability: 1.0  # keep all subagent datums (v35: 0.25)
    subagent_datum_sampling_seed: 343
    filter_errors: true
    filter_message_actions: false
    filter_zero_advantage_datums: false
    straggler_timeout_seconds: 900
    straggler_quorum: 6
    min_successful_group_size: 4
    rollout_config:
      max_steps: 200
      timeout: 7200
      step_timeout: 7200
      propagate_root_success: false
      verbose: true
      inference_params:
        temperature: 1.0
        top_p: 1.0
        max_completion_tokens: 4096
  # 24 task groups x 8 members; keep the previous rollout concurrency.
  num_concurrent_rollout_workflow_workers: 24

eval:
  strategy: none
  every: 0
  num_concurrent_rollout_workflow_workers: 1
  workflow_config:
    group_size: 1
    filter_errors: false
    filter_zero_advantage_datums: false
    rollout_config:
      max_steps: 200
      timeout: 7200
      step_timeout: 7200
      inference_params:
        temperature: 1.0
        max_completion_tokens: 4096

# ~490 GB per save_state. AReaL-style two-tier cadence: `every: 20` writes a
# permanent checkpoint (name `<batch>`) that is kept forever (~15 h apart at
# 45-min steps), and `recovery_every: 1` writes a full weights+optimizer
# checkpoint (name `recovery-<batch>`) after every other step, so a crash loses
# at most one step. Each (re)launch also writes `recovery-<start_batch>`. The
# client-side pruner keeps only the newest 2 recovery checkpoints (plus the
# resume point) and every permanent one.
checkpoint:
  strategy: step
  every: 20
  recovery_every: 1
  load_checkpoint_path: null

log_path: /groups/gai51740/aci18912it/miles-tinker/runs/default/logs   # overridden by --log_path
tinker_base_url: null                     # --tinker_base_url; the proxy also needs env TINKER_BASE_URL

watchdog:
  enabled: true
  timeout_seconds: 14400
  exit_code: 2

stats:
  experiment_name: toolathlon-openhands-miles-tinker
  trial_name: abci_toolathlon_8node_nonrecursive_qwen36_binary_nomsg_2h_v8
  wandb:
    mode: online
    project: toolathlon-openhands
    entity: null
    group: toolathlon-timeout-ablation-v8
    tags:
      - openreward
      - toolathlon
      - openhands
      - tinker
      - miles-tinker
      - qwen36
      - r3
      - nonrecursive

# Root environment grading only; child verifiers and usage judges are disabled.
openreward:
  env_name: toolathlongym
  split: train
  eval_split: null
  session_url: http://localhost:8082
  api_url: null
  api_key: local
  train_task_limit: null
  eval_task_limit: null
  task_names: null
  max_tool_calls: 0
  balance_accepted_batches: false
  accepted_batch_max_replacement_rounds: 8
  enable_programmatic_tool_calling: true
  programmatic_tool_calling_mode: orchestration_only
  programmatic_tool_calling_max_tool_calls_per_execution: 1024
  enable_task_tracker: true
  enable_recursive_subagents: false
  subagent_environment_access: shared
  subagent_default_max_steps: 100
  subagent_max_depth: 2
  enable_subagent_reward_judging: false
  subagent_reward_judge_max_steps: 100
  enable_subagent_behavior_judging: false
  enable_subagent_parent_usage_eligibility_gate: false
  subagent_parent_usage_judge_max_concurrency: 4
  subagent_behavior_judge_max_prompt_tokens: 24576
  subagent_behavior_judge_max_output_tokens: 4096
  subagent_behavior_judge_timeout_seconds: 300.0
  subagent_delegation_reward_coefficient: 0.0
  openhands_system_prompt_suffix: null
  condenser_disable_thinking: false
  condenser_max_tokens: 52428
  condenser_max_completion_tokens: 26214
  environments:
    - label: toolathlon
      env_name: toolathlongym
      split: train
      eval_split: train
      session_url: http://localhost:8082
      session_urls_env_var: OPENREWARD_SESSION_URLS_TOOLATHLON
      api_key: local
      train_task_limit: null
      eval_task_limit: null
      max_tool_calls: 0
      sampling_weight: 1.0

seed: 343
