# 48K policy output, 128K context, native medium reasoning; 12-hour training request limit.
# Frontier-CS native scores; 10 nodes: 5 training (TP4/DP10), 5 inference.
# The recursive variants enable child verification/behavior judging via launch overrides.
# Allow native grading to drain pending iterative work and evaluate current/best
# artifacts (up to three hours each), with room for agent work and setup queues.
train:
  model_name: /groups/gai51740/aci18912it/rasp/cache/huggingface/hub/models--apurvaga--Qwen3.8-27B-preserve-thinking/snapshots/97c725615b8aa025b800da4ceed38811358b30f1
  renderer_name: qwen3_8_preserve_thinking
  renderer_kwargs:
    preserve_thinking: true
    enable_thinking: true
    reasoning_effort: medium
  context_window_length: 131072
  batch_size: 32
  num_epochs: 10
  max_training_steps: null
  num_minibatches: 1
  num_microbatches: 1
  # Long-horizon batches contain many sequential gateway training units.
  forward_backward_timeout_seconds: 43200
  max_staleness: 3
  lora_rank: 32
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 1.0e-06
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-08
    weight_decay: 0.017
    grad_clip_norm: 1.0
  workflow_config:
    group_size: 8
    rollout_isolation: process
    leave_one_out_baseline: true
    depth_level_weighting: true
    subagent_datum_keep_probability: 1.0
    subagent_datum_sampling_seed: 343
    filter_errors: true
    filter_message_actions: false
    filter_zero_advantage_datums: false
    # Native optimization graders can legitimately outlast faster group members.
    straggler_timeout_seconds: null
    straggler_quorum: null
    min_successful_group_size: 4
    rollout_config:
      max_steps: 200
      timeout: 50400
      step_timeout: 36000
      propagate_root_success: false
      verbose: true
      inference_params:
        temperature: 1.0
        top_p: 1.0
        max_completion_tokens: 49152
    token_efficiency_reward:
      enabled: false
      coefficient: 0.003
      reference_tokens: 20000.0
      max_penalty: 0.8
      input_token_weight: 0.01
      output_token_weight: 1.0
      attribution: policy_subtree
  rollout_group_key: _openreward_environment
  rollout_group_limits:
    fcs_2_0: 2
  num_concurrent_rollout_workflow_workers: 48
eval:
  strategy: none
  every: 0
  num_concurrent_rollout_workflow_workers: 1
  workflow_config:
    group_size: 1
    filter_errors: false
    filter_zero_advantage_datums: false
    rollout_config:
      max_steps: 200
      timeout: 50400
      step_timeout: 36000
      inference_params:
        temperature: 1.0
        max_completion_tokens: 49152
checkpoint:
  strategy: step
  every: 20
  recovery_every: 1
  load_checkpoint_path: null
