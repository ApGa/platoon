defaults:
  - toolathlon_openhands_areal_prealloc_16node-cp-r3-fp32-lm-head
  - _self_


# Keep the inherited model/backend visible in this concrete launch file. The
# preallocation wrapper inspects the literal YAML before Hydra composition to
# select the local tokenizer snapshot and build Megatron's TE/APEX extensions.
actor:
  backend: megatron:(attn:d5p2t4c2|ffn:d5p2t1e8)
  path: Qwen/Qwen3.6-35B-A3B

# Keep the equal-weight rotating submission mix, but consume completed groups
# asynchronously so future rollouts overlap PPO. Accepted optimizer batches may
# drift toward faster environments; per-environment telemetry tracks that drift.
openreward:
  balance_accepted_batches: false
  accepted_batch_max_replacement_rounds: 8
  environments:
    - label: toolathlon
      env_name: toolathlongym
      split: train
      eval_split: train
      session_url: http://localhost:8082
      session_urls_env_var: OPENREWARD_SESSION_URLS_TOOLATHLON
      api_key: local
      train_task_limit: 16
      eval_task_limit: 4
      max_tool_calls: 0
      sampling_weight: 1.0

    - label: tmax
      env_name: tmax/TMax-15K-Harbor
      split: train
      eval_split: train
      session_url: http://localhost:8083
      session_urls_env_var: OPENREWARD_SESSION_URLS_TMAX
      api_key: local
      train_task_limit: 16
      eval_task_limit: 4
      max_tool_calls: 0
      sampling_weight: 1.0

    - label: swe_rebench
      env_name: nebius/SWE-rebench-V2
      split: train
      eval_split: train
      session_url: http://localhost:8084
      session_urls_env_var: OPENREWARD_SESSION_URLS_SWE_REBENCH
      api_key: local
      train_task_limit: 16
      eval_task_limit: 4
      max_tool_calls: 0
      sampling_weight: 1.0

# Keep the requested 8x8 batch: eight task groups per optimizer step and eight
# trajectories per group. Six completed members arm the proven 15-minute tail
# grace; groups with at least four usable members can still train after tails
# are reaped.
train_dataset:
  batch_size: 8

workflow_config:
  group_size: 8
  straggler_timeout_seconds: 900
  straggler_quorum: 6
  subprocess_shutdown_grace_seconds: 10
  min_successful_group_size: 4

# The controller's inherited 3600s request deadline previously cancelled an
# entire TMax group before its internal 3600s rollout bound plus tail cleanup
# could return partial members. Match the proven recursive-job envelopes so the
# workflow owns rollout/tail termination and the controller only backstops it.
rollout:
  request_timeout: 12600
  agent:
    session_timeout_seconds: 7200

# Every update costs roughly an hour, so make each completed update durable.
# Time-based recovery previously let a completed step disappear on requeue.
recover:
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

# Keep the same 48 selected task groups per epoch as the original small
# Toolathlon trial (6 global batches x 8 tasks), now split 1:1:1.
trial_name: toolathlon-tmax-swe-openhands-16node-qwen3.6-35B-r3-fp32-lm-head-trial0

stats_logger:
  wandb:
    project: openreward-multienv-openhands
