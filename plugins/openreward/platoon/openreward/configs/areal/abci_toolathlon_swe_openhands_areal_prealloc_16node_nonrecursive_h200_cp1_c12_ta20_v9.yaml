defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_16node_nonrecursive_h200_cp1_c12_ta20_v8
  - _self_

# Fresh model-only lineage for the PBS-portable Toolathlon service image.  The
# new trial cannot discover v7/v8 optimizer or rollout state because AReaL
# derives recovery state beneath this exact experiment/trial identity.  Start
# from the pinned model snapshot, retain the proven H200 topology, and run the
# complete ten-epoch curriculum without a benchmarking step cap.
experiment_name: abci-openreward-ta-swe-h200-16
trial_name: abci-ta-swe16-nonrec-h200-cp1-c12-v9-trial0
total_train_epochs: 10
total_train_steps: null
tokenizer_path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

# Repeat every literal consumed by the host launcher's pre-Hydra fail-closed
# checks.  PTC remains disabled for the requested no-PTC comparison.
scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: false
  enable_programmatic_tool_calling: false

actor:
  path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

sglang:
  model_path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

stats_logger:
  wandb:
    group: abci-ta-swe16-nonrec-h200-cp1-c12-v9
