defaults:
  - toolathlon_tmax_swe_openhands_areal_prealloc_16node-cp-r3-fp32-lm-head
  - _self_

# Keep recursive checkpoints separate from the non-recursive mixed run. The
# mixed launcher can select this file explicitly without changing its default.
trial_name: toolathlon-tmax-swe-openhands-16node-qwen3.6-35B-ptc-recursive-r3-fp32-lm-head-trial0

openreward:
  enable_programmatic_tool_calling: true
  programmatic_tool_calling_mode: orchestration_only
  enable_recursive_subagents: true
  # Until isolated write leases exist, every child is restricted to live,
  # read-only inspection so it cannot race or finish the root session.
  subagent_environment_access: read_only
  subagent_default_max_steps: 50
  # Root is depth 0. Match the established Toolathlon recursive run while
  # bounding a tree to children and grandchildren.
  subagent_max_depth: 2

workflow_config:
  # Recursive rollouts add a variable number of child trajectories. Balance
  # their contribution by depth so prolific deeper levels do not dominate.
  depth_level_weighting: true
  depth_level_discount_gamma: null
  # Match the established Toolathlon recursive baseline: every trajectory in a
  # rollout uses the mean root reward from the other group samples as baseline.
  leave_one_out_baseline: true
  rollout_config:
    # Investigative children cannot submit in any environment. Train every
    # trajectory toward the root result; all children use the same reward contract.
    propogate_root_success: true

# The preallocation launcher reads these fields before Hydra composes defaults
# so it can select the tokenizer and prepare Megatron's cached extensions.
actor:
  backend: megatron:(attn:d5p2t4c2|ffn:d5p2t1e8)
  path: Qwen/Qwen3.6-35B-A3B
