defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_32node_recursive_h200_qwen36_moe_cp2_c24_ta20_v26_fresh_d2_noeff
  - _self_

# Fresh Toolathlon-only Qwen3.6 trial. Verifier rewards retain the child-local
# behavior gate, and successful children are policy-eligible only when a
# post-parent audit decisively finds that the parent used their contribution.
experiment_name: abci-or-ta32-q36-cp2-behavior-usage-gate-v33
trial_name: abci-ta32-rec-q36m-cp2-c12-d2-behavior-usage-gate-v33-t0

train_dataset:
  batch_size: 8

workflow_config:
  group_size: 8
  # Keep every root and independently retain 25% of eligible, completed
  # non-root policy datums after all three judgments have been merged.
  subagent_datum_keep_probability: 0.25
  straggler_timeout_seconds: 900
  straggler_quorum: 6
  subprocess_shutdown_grace_seconds: 10
  min_successful_group_size: 4
  rollout_config:
    max_steps: 200
    timeout: 3600
    step_timeout: 2700
    propagate_root_success: false
  token_efficiency_reward:
    enabled: false

rollout:
  # Twelve TP8 replicas consume the 96 inference GPUs from the inherited
  # 32-node split. Actor and reference training retain the 160-GPU CP2 layout.
  max_concurrent_rollouts: 12
  consumer_batch_size: 8

openreward:
  enable_recursive_subagents: true
  enable_programmatic_tool_calling: true
  programmatic_tool_calling_mode: orchestration_only
  programmatic_tool_calling_max_tool_calls_per_execution: 1024
  subagent_environment_access: shared
  subagent_default_max_steps: 100
  subagent_max_depth: 2
  enable_subagent_reward_judging: true
  subagent_reward_judge_max_steps: 100
  # The evolving rollout policy performs both one-shot process audits. The
  # parent-usage audit runs only for positive child judgments and only after
  # the parent has finished; inconclusive usage audits fail open.
  enable_subagent_behavior_judging: true
  enable_subagent_parent_usage_eligibility_gate: true
  subagent_parent_usage_judge_max_concurrency: 4
  subagent_behavior_judge_max_prompt_tokens: 24576
  subagent_behavior_judge_max_output_tokens: 4096
  subagent_behavior_judge_timeout_seconds: 300.0
  subagent_delegation_reward_coefficient: 0.0
  eval_split: null
  eval_task_limit: null
  environments:
    - label: toolathlon
      env_name: toolathlongym
      split: train
      eval_split: train
      session_url: http://localhost:8082
      session_urls_env_var: OPENREWARD_SESSION_URLS_TOOLATHLON
      api_key: local
      train_task_limit: null
      eval_task_limit: null
      max_tool_calls: 0
      sampling_weight: 1.0

valid_dataset: null
evaluator:
  eval_before_train: false
  freq_epochs: null
  freq_steps: null
  freq_secs: null

scheduler:
  type: pbs_prealloc

cluster:
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}

stats_logger:
  wandb:
    project: toolathlon-openhands
    group: abci-ta32-rec-q36m-cp2-c12-d2-behavior-usage-gate-v33
