defaults:
  - toolathlon_tmax_swe_openhands_areal_prealloc_32node-cp-ptc-recursive-judged-r3-fp32-lm-head-bs8-efficiency
  - _self_

# Fresh recovery lineage: the prior mixed recursive run is beyond step 20.
trial_name: ta-swe32-rec-ta20-v1-trial0

openreward:
  balance_accepted_batches: false

  # Preserve the latest recursive workspace semantics explicitly rather than
  # depending on the historical three-environment parent config.
  subagent_environment_access: shared

  # Warm up delegation on Toolathlon for logical steps 0..19. SWE-rebench joins
  # with equal submission weight at step 20. In-flight warmup work may make the
  # first mixed update Toolathlon-heavy; native async dispatch then converges to
  # the configured steady-state input mix. TMax is intentionally absent.
  environments:
    - label: toolathlon
      env_name: toolathlongym
      split: train
      eval_split: train
      session_url: http://localhost:8082
      session_urls_env_var: OPENREWARD_SESSION_URLS_TOOLATHLON
      api_key: local
      train_task_limit: null
      eval_task_limit: null
      max_tool_calls: 0
      sampling_weight: 1.0
      sampling_start_step: 0

    - label: swe_rebench
      env_name: nebius/SWE-rebench-V2
      split: train
      eval_split: train
      session_url: http://localhost:8084
      session_urls_env_var: OPENREWARD_SESSION_URLS_SWE_REBENCH
      api_key: local
      train_task_limit: null
      eval_task_limit: null
      max_tool_calls: 0
      sampling_weight: 1.0
      sampling_start_step: 20

stats_logger:
  wandb:
    project: openreward-multienv-openhands
    group: ta-swe32-rec-ta20-v1

# Literal values are required by the pre-Hydra launcher setup.
actor:
