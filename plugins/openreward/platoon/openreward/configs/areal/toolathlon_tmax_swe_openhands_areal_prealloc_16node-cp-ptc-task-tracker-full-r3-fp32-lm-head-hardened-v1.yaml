  - _self_

# Start a completely new model/optimizer lineage. The previous trial's recovery
# state contains the step-134 non-finite update and must never be auto-loaded.
# Keep this short: AReaL constructs the W&B run ID as
# <experiment_name>_<trial_name>_<id_suffix>, and W&B caps it at 128 chars.
trial_name: mix16-ptc-full-hard-v6-trial0

# Keep literal sections for the pre-Hydra launcher checks. All mixed catalog,
# asynchronous 8x8, task-tracker/PTC, straggler, no-eval, and per-step recovery
# settings are inherited from the proven full nonrecursive configuration.
openreward:
  # Reasoning may improve condensation quality. The safe condenser retains
  # only the public post-thinking state summary.
  condenser_disable_thinking: false
  condenser_max_completion_tokens: 26214

# Use stable, short W&B grouping independently of the recovery lineage.
stats_logger:
  wandb:
    group: mix16-ptc-full-hard-v6

