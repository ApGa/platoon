defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_32node_recursive_h200_cp1_c24_ta20_v8
  - _self_

# Fresh independent lineage for the PBS-portable Toolathlon service image.
# Keep the validated 32-node recursive H200 topology, complete ten-epoch
# curriculum, task tracker, and recursive subagents.  PTC is explicitly on in
# orchestration-only mode with the production 1024-call execution budget.
experiment_name: abci-openreward-ta-swe-h200-32
trial_name: abci-ta-swe32-rec-h200-cp1-c24-v9-trial0
total_train_epochs: 10
total_train_steps: null
tokenizer_path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 32
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: true
  enable_programmatic_tool_calling: true
  programmatic_tool_calling_mode: orchestration_only
  programmatic_tool_calling_max_tool_calls_per_execution: 1024

actor:
  path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

sglang:
  model_path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

stats_logger:
  wandb:
    group: abci-ta-swe32-rec-h200-cp1-c24-v9
