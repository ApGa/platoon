defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_16node_nonrecursive_h200_cp1_c12_bench28_v8
  - _self_

# Higher rollout-pressure arm: only admission concurrency changes relative to
# the fresh CP1/C12 control; actor and six TP8 rollout replicas stay identical.
experiment_name: abci-openreward-ta-swe-h200-16-bench28-v8-cp1-c24
trial_name: abci-ta-swe16-bench28-v8-cp1-c24-trial0
total_train_steps: 28

scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: false
  enable_programmatic_tool_calling: false

rollout:
  max_concurrent_rollouts: 24

stats_logger:
  wandb:
    group: abci-ta-swe16-bench28-v8-cp1-c24
