defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_32node_recursive_h200_cp1_c24_ta20_v3
  - _self_

# Fresh retry after v3 reached healthy remote environment services but
# controller-side task discovery still used the inherited localhost URL. The
# endpoint-routing correction is runtime code; this leaf changes only identity
# and repeats the invariants required by the pre-Hydra shell preflight.
experiment_name: abci-openreward-ta-swe-h200-32
trial_name: abci-ta-swe32-rec-h200-cp1-c24-v4-trial0

scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 32
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: true

stats_logger:
  wandb:
    group: abci-ta-swe32-rec-h200-cp1-c24-v4
