defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_16node_nonrecursive_h200_cp1_c12_ta20_v4
  - _self_

# Fresh retry after v4 proved remote catalog routing and reached actor launch,
# then failed because the controller-host /local bind source was absent on the
# other actor nodes. The all-node initializer is runtime code; this leaf changes
# only identity and repeats the invariants required by the shell preflight.
experiment_name: abci-openreward-ta-swe-h200-16
trial_name: abci-ta-swe16-nonrec-h200-cp1-c12-v5-trial0

scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: false

stats_logger:
  wandb:
    group: abci-ta-swe16-nonrec-h200-cp1-c12-v5
