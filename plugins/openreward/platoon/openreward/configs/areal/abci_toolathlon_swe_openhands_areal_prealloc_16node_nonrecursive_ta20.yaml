defaults:
  - toolathlon_swe_openhands_areal_prealloc_16node-cp-ptc-task-tracker-full-r3-fp32-lm-head-ta20-curriculum
  - _self_

# Fresh ABCI model/optimizer lineage.  This leaf changes only cluster/runtime
# placement and identity; the inherited 8x8 asynchronous curriculum semantics
# remain unchanged.
experiment_name: abci-openreward-ta-swe
trial_name: abci-ta-swe16-nonrec-ta20-v1-trial0
tokenizer_path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: false
  enable_programmatic_tool_calling: true
  programmatic_tool_calling_mode: orchestration_only
  enable_task_tracker: true
  programmatic_tool_calling_max_tool_calls_per_execution: 1024
  balance_accepted_batches: false

actor:
  backend: megatron:(attn:d5p2t4c2|ffn:d5p2t1e8)
  path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

sglang:
  model_path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

# Every completed update is the durable proof consumed by the recursive gate.
recover:
  freq_epochs: null
  freq_steps: 1
  freq_secs: null

valid_dataset: null
evaluator:
  eval_before_train: false
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  wandb:
    mode: online
    project: openreward-multienv-openhands
    group: abci-ta-swe16-nonrec-ta20-v1
