defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_32node_recursive_ta20
  - _self_

# Fresh H200 optimization lineage.  Keep the 160-GPU actor and twelve
# independent TP8 rollout replicas from the recursive parity topology.  This
# run is intentionally independent of the nonrecursive job and may run beside
# it; it does not recover either job's optimizer or rollout state.
experiment_name: abci-openreward-ta-swe-h200-32
trial_name: abci-ta-swe32-rec-h200-cp1-c24-v1-trial0
tokenizer_path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 32
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: true

actor:
  # Attention: 20 * 2 * 4 * 1 = 160 GPUs.
  # FFN:       10 * 2 * 1 * 8 = 160 GPUs on the same actor ranks.
  backend: megatron:(attn:d20p2t4c1|ffn:d10p2t1e8)
  path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

rollout:
  # With twelve SGLang replicas, twenty-four admits two workflow groups per
  # replica.  The inherited backend remains sglang:d12p1t8 (96 GPUs).
  max_concurrent_rollouts: 24

sglang:
  model_path: ${oc.env:PLATOON_MODEL_SNAPSHOT}

stats_logger:
  wandb:
    mode: online
    project: openreward-multienv-openhands
    group: abci-ta-swe32-rec-h200-cp1-c24-v1
