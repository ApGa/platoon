experiment_name: openreward-openhands
trial_name: toolathlon-openhands-16node-qwen3.6-35B-trial1

seed: 343
total_train_epochs: 10
tokenizer_path: ${actor.path}

openreward:
  env_name: toolathlongym
  split: train
  eval_split: train
  # Default backend; the launch script overrides this (and/or sets
  # OPENREWARD_SESSION_URLS for cross-node sharding) at runtime.
  session_url: http://localhost:8082
  api_url: null
  api_key: local
  train_task_limit: null
  eval_task_limit: 50
  task_names: null
  max_tool_calls: 0

# Run AReaL workers as srun steps inside this (preallocated) sbatch allocation.
scheduler:
  type: slurm_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: /lustre/fsw/portfolios/nvr/projects/nvr_lacr_llm/users/apurvag/experiments/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /lustre/fsw/portfolios/nvr/projects/nvr_lacr_llm/users/apurvag/experiments/areal/name_resolve

rollout:
  # 128 GPUs total: 48 for sglang inference (6 x TP8) and 80 for the
  # Megatron actor (DP5 x PP2 x TP4 x CP2).
  backend: sglang:d6p1t8
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  scheduling_spec: ${actor.scheduling_spec}
  setup_timeout: 900
  max_concurrent_rollouts: 8
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 3
  enable_rollout_tracing: false
  # The rollout OpenAI proxy (areal ArealOpenAI) parses model tool calls with this
  # parser. Qwen3.5 emits tool calls in the Qwen3-Coder XML format
  # (<tool_call><function=name><parameter=k>v</parameter></function></tool_call>);
  # AReaL's default "qwen" (Qwen2.5, JSON-in-<tool_call>) can't parse that, so
  # tool_calls come back null and OpenHands ends every episode after 1 step.
  agent:
    tool_call_parser: qwen3_coder
    reasoning_parser: qwen3

workflow_config:
  rollout_config:
    model_name: ${actor.path}
    max_steps: 100
    output_dir: ${cluster.fileroot}/${trial_name}
    verbose: true
    train: true
    timeout: 3600
    step_timeout: 1800
    inference_params:
      temperature: 1.0
      max_completion_tokens: 4096
  group_size: 8
  use_subprocesses: true
  filter_zero_variance_groups: false

loss_fn_config:
  loss_fn: cispo
  loss_fn_kwargs:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0

actor:
  backend: megatron:(attn:d5p2t4c2|ffn:d5p2t1e8)
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.6-35B-A3B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    max_tokens_per_mb: 32768 #40000
  optimizer:
    type: adam
    lr: 3e-6
    weight_decay: 0.017
    beta1: 0.9
    beta2: 0.95
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python -m areal.infra.rpc.rpc_server
      env_vars: {}
  eps_clip: 0.2
  eps_clip_higher: 0.26
  reward_scaling: 1.0
  reward_bias: 0.0
  kl_ctl: 0.0
  kl_estimator: k1
  ppo_n_minibatches: 1
  recompute_logprob: false
  use_decoupled_loss: false
  reward_norm:
    mean_level: null
    std_level: null
  adv_norm:
    mean_level: null
    std_level: null
  megatron:
    bridge_type: megatron-bridge
    enable_mtp: false
    use_bridge_for_update_weights: true # for live weight sync
    use_deterministic_algorithms: true

ref:
  backend: ${actor.backend}
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: ${actor.path}
  init_from_scratch: false
  disable_dropout: true
  dtype: ${actor.dtype}
  mb_spec:
    max_tokens_per_mb: 32768 #40000
  optimizer: null
  scheduling_strategy:
    type: colocation
    target: actor
  scheduling_spec: ${actor.scheduling_spec}

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  skip_tokenizer_init: false
  dtype: ${actor.dtype}
  max_running_requests: null
  context_length: 32769 #40001
  mem_fraction_static: 0.8

train_dataset:
  batch_size: 8 #16

valid_dataset:
  batch_size: 50

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: 25
  freq_secs: null

recover:
  mode: auto
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: 5
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: online
    project: toolathlon-openhands
