defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_16node_nonrecursive_h200_cp1_c12_ta20_v6
  - _self_

# Fresh retry after v6 proved actor and SGLang initialization, then failed
# before rollout because AReaL sent the host-controller interpreter to the
# contained inline-proxy guard. The PBS scheduler now supplies the immutable
# worker-container interpreter. PTC is intentionally disabled for this ABCI
# comparison; native environment tools and the task tracker remain configured.
experiment_name: abci-openreward-ta-swe-h200-16
trial_name: abci-ta-swe16-nonrec-h200-cp1-c12-v7-trial0

# Repeat the production invariants consumed by the shell's literal fail-closed
# preflight. Placement and recursion match v6; PTC is deliberately overridden.
scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: false
  # Explicit no-PTC comparison against the other-cluster PTC runs.
  enable_programmatic_tool_calling: false

stats_logger:
  wandb:
    group: abci-ta-swe16-nonrec-h200-cp1-c12-v7
