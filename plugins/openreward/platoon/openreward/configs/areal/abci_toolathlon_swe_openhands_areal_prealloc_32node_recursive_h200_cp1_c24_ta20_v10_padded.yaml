defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_32node_recursive_h200_cp1_c24_ta20_v9
  - _self_

# Fresh CP1 lineage for the padded-BSHD GDN control with signal-only training
# batches.  Recursive/PTC production behavior remains inherited from v9; this
# v14 identity cannot discover any preceding run state. Two bounded collection
# rounds reserve one extra dynamic-batch pull without exceeding accepted-version
# capacity: 2 rounds * train batch 8 == rollout consumer capacity 16.
experiment_name: abci-or-ta-swe32-cp1-v14
trial_name: abci-ta-swe32-rec-cp1-c24-v14-t0

dynamic_bs: true

workflow_config:
  filter_zero_advantage_datums: true
  filter_zero_variance_groups: true
  dynamic_batch_recollection_max_rounds: 2

rollout:
  consumer_batch_size: 16

# Repeat every literal consumed by the host launcher's pre-Hydra fail-closed
# checks.  These values intentionally match the inherited production config.
scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 32
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: true
  enable_programmatic_tool_calling: true
  programmatic_tool_calling_mode: orchestration_only
  programmatic_tool_calling_max_tool_calls_per_execution: 1024

stats_logger:
  wandb:
    group: abci-ta-swe32-rec-cp1-c24-v14
