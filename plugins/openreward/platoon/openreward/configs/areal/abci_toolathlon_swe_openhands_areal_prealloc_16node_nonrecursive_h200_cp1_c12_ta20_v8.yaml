defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_16node_nonrecursive_h200_cp1_c12_ta20_v7
  - _self_

# Fresh lineage for the isolated 376d1b9 Platoon + b1acf52 OpenHands +
# 18e62c0 Toolathlon stack. The successful v7 topology and full horizon remain
# unchanged. PTC stays explicitly disabled for the cross-cluster comparison;
# native environment tools and the task tracker remain configured.
experiment_name: abci-openreward-ta-swe-h200-16
trial_name: abci-ta-swe16-nonrec-h200-cp1-c12-v8-trial0

# Literal invariants are repeated for the host shell's pre-Hydra fail-closed
# checks. They also make the intentional no-PTC semantic visible in this leaf.
scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: false
  enable_programmatic_tool_calling: false

stats_logger:
  wandb:
    group: abci-ta-swe16-nonrec-h200-cp1-c12-v8
