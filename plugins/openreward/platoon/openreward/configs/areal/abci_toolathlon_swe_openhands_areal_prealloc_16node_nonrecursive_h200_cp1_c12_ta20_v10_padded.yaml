defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_16node_nonrecursive_h200_cp1_c12_ta20_v9
  - _self_

# Fresh CP1 lineage for the padded-BSHD GDN control with signal-only training
# batches.  The worker derives padded GDN from the model family and CP1
# topology; this concise v14 identity avoids AReaL's 128-character W&B cap and
# cannot discover any preceding run state.
experiment_name: abci-or-ta-swe16-cp1-v14
trial_name: abci-ta-swe16-nr-cp1-c12-v14-t0

dynamic_bs: true

workflow_config:
  filter_zero_advantage_datums: true
  filter_zero_variance_groups: true
  dynamic_batch_recollection_max_rounds: 1

rollout:
  consumer_batch_size: 8

# Repeat every literal consumed by the host launcher's pre-Hydra fail-closed
# checks.  These values intentionally match the inherited production config.
scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: false
  enable_programmatic_tool_calling: false

stats_logger:
  wandb:
    group: abci-ta-swe16-nr-cp1-c12-v14
