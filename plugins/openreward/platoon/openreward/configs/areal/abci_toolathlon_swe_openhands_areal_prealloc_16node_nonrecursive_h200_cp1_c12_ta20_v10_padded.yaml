defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_16node_nonrecursive_h200_cp1_c12_ta20_v9
  - _self_

# Fresh CP1 lineage for the padded-BSHD GDN control.  Everything except the
# experiment/trial identity is inherited from the full-horizon v9 production
# configuration; the PBS wrapper separately attests that packed GDN is off.
experiment_name: abci-openreward-ta-swe-h200-16-cp1-padded
trial_name: abci-ta-swe16-nonrec-h200-cp1-c12-v10-padded-trial0

# Repeat every literal consumed by the host launcher's pre-Hydra fail-closed
# checks.  These values intentionally match the inherited production config.
scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: false
  enable_programmatic_tool_calling: false

stats_logger:
  wandb:
    group: abci-ta-swe16-nonrec-h200-cp1-c12-v10-padded
