defaults:
  - abci_toolathlon_swe_openhands_areal_prealloc_16node_nonrecursive_h200_cp1_c12_ta20_v2
  - _self_

# Fresh retry after the v2 leaf correctly failed the launcher's literal-leaf
# preflight before starting services. These values deliberately repeat the
# inherited production invariants: the shell preflight runs before the pinned
# Hydra/controller environment exists and must not compose live source with an
# unvalidated host dependency closure.
experiment_name: abci-openreward-ta-swe-h200-16
trial_name: abci-ta-swe16-nonrec-h200-cp1-c12-v3-trial0

scheduler:
  type: pbs_prealloc

cluster:
  n_nodes: 16
  n_gpus_per_node: 8
  fileroot: ${oc.env:PLATOON_EXPERIMENT_ROOT}
  name_resolve:
    type: nfs
    nfs_record_root: ${oc.env:PLATOON_NAME_RESOLVE_ROOT}

openreward:
  enable_recursive_subagents: false

stats_logger:
  wandb:
    group: abci-ta-swe16-nonrec-h200-cp1-c12-v3
