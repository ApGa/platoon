# OpenReward Toolathlon + OpenHands inference benchmark config.

inference:
  model_name: openai/nvidia/qwen/qwen3.5-35b-a3b
  model_endpoint: null
  model_api_key: null
  output_dir: ./inference_results/toolathlon_openhands-qwen3.5-35b-a3b-test-1
  resume: true
  workflow:
    num_rollouts_per_task: 4
    num_concurrent_workers: 32
    success_threshold: 1.0
    fail_fast: false
    use_subprocesses: true
    subprocess_max_workers: 128
    rollout_config:
      max_steps: 100
      output_dir: ./inference_results/toolathlon_openhands-qwen3.5-35b-a3b-test-1/rollouts
      verbose: true
      timeout: 3600
      step_timeout: 900
      inference_params:
        temperature: null
        top_p: null
        max_completion_tokens: 4096

openreward:
  env_name: toolathlongym
  split: train
  eval_split: train
  session_url: http://localhost:8082
  api_url: null
  api_key: local
  train_task_limit: 600
  eval_task_limit: 50
  task_names: null
  max_tool_calls: 0

task_id: null
# full: run rollouts + report
# rollouts: only write rollouts to disk
# report: only read existing rollouts and generate report
stage: full
shuffle_tasks: false
seed: 42
