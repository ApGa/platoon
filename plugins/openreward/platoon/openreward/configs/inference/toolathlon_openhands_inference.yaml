# OpenReward Toolathlon + OpenHands inference benchmark config.

inference:
  model_name: openai/aws/anthropic/bedrock-claude-opus-4-7
  model_endpoint: null
  model_api_key: null
  output_dir: ./inference_results/toolathlon_openhands-opus4-7-test-3
  resume: true
  workflow:
    num_rollouts_per_task: 8
    num_concurrent_workers: 128
    success_threshold: 1.0
    fail_fast: false
    use_subprocesses: true
    subprocess_max_workers: 128
    rollout_config:
      max_steps: 100
      output_dir: ./inference_results/toolathlon_openhands-opus4-7-test-3/rollouts
      verbose: true
      timeout: 600
      step_timeout: 300
      inference_params:
        temperature: null
        top_p: null
        max_completion_tokens: 4096

openreward:
  env_name: toolathlongym
  split: train
  eval_split: train
  session_url: http://localhost:8082
  api_url: null
  api_key: local
  train_task_limit: 48
  eval_task_limit: 50
  task_names: null
  max_tool_calls: 0
  enable_programmatic_tool_calling: false
  enable_recursive_subagents: false
  subagent_default_max_steps: 50
  subagent_max_depth: null
  openhands_system_prompt_suffix: null

task_id: null
# full: run rollouts + report
# rollouts: only write rollouts to disk
# report: only read existing rollouts and generate report
stage: full
shuffle_tasks: false
seed: 42
