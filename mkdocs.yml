site_name: platoon
site_description: Build and train systems of agents.
site_url: https://apga.github.io/platoon/
repo_url: https://github.com/ApGa/platoon
repo_name: ApGa/platoon
edit_uri: edit/main/docs/
copyright: Copyright &copy; Apurva Gandhi — Apache 2.0

docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
    view: material/eye-outline
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
    - content.tooltips
    - announce.dismiss

extra_css:
  - assets/stylesheets/platoon.css

# Mermaid is vendored rather than pulled from a CDN at runtime, so diagrams render
# offline and behind proxies that block third-party hosts.
extra_javascript:
  - assets/javascripts/mermaid.min.js
  - assets/javascripts/mermaid-init.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ApGa/platoon
      name: Platoon on GitHub
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: pl-mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: false
  - minify:
      minify_html: true

watch:
  - docs

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Installation: get-started/installation.md
      - Quickstart: get-started/quickstart.md
      - Core concepts: get-started/concepts.md
  - Guides:
      - guides/index.md
      - Build your first task: guides/first-plugin.md
      - Multi-agent workflows: guides/multi-agent.md
      - Evaluate a model: guides/evaluate.md
      - Inspect rollouts: guides/inspect-rollouts.md
      - Extend the framework: guides/extend.md
      - Run at scale: guides/scale.md
  - Architecture:
      - architecture/index.md
      - Components and the registry: architecture/components.md
      - Execution model: architecture/execution.md
      - Training backends: architecture/backends.md
  - Plugins:
      - plugins/index.md
      - Plugin catalog: plugins/catalog.md
      - OpenHands: plugins/openhands.md
      - OpenReward: plugins/openreward.md
  - Reference:
      - reference/index.md
      - Configuration: reference/configuration.md
      - CLI: reference/cli.md
      - FAQ: reference/faq.md
  - Contributing: contributing.md
  - Citation: citation.md
