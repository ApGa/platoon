# The RAO paper's single agent on TextCraft-Synth, on Tinker: one CodeAct agent with 200 steps and no subagents.
# The "Single" rows of the paper's Table 1(b), whose agents trained with a 40k context.
#
#   platoon train recipes/rao/textcraft-synth/linear.yaml [key=value ...]
#
# The shared settings are in common.yaml, and README.md gives every setting's source. The platoon-codeact harness
# renders the linear prompts of the earlier TextCraftAgent and offers no launch_subagent; agents.max_depth 0 refuses
# any spawn.

extends: common.yaml

environments:
  - env: textcraft-synth@1          # the environment, its prompts, the val split and platoon-delegation, version 1
    harness: platoon-codeact
    harness_options:
      prompt_builder_options: {variant: linear}
      subagents: false
      cell_timeout_s: 7200
    agents:
      max_depth: 0
    dataset_kwargs: {split_name: train-medium}
    eval_dataset_kwargs: {limit: 100}

train:
  max_concurrent_rollouts: 128  # 16 groups of 8 at once, as the paper's linear run
  workflow_config:
    leave_one_out_baseline: false   # rewards centered on the group's mean: the paper's linear runs had no leave-one-out
    rollout_config:
      max_steps: 200

stats:
  trial_name: qwen3-4b-instruct-2507-linear-groupmean-lora32
  wandb:
    tags: [rao, textcraft-synth, tinker, linear]
