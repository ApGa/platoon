# The RAO paper's TextCraft-Synth setting on Tinker: what all of its arms share. linear.yaml, recursive.yaml and
# ablation_sparse.yaml extend this file, and each adds its environment entry, its step budget, its baseline and its
# credit. README.md gives every setting's source: the paper (arXiv 2605.06639) and the AReaL configs its runs trained
# with.
#
# Qwen3-4B-Instruct-2507 on the 852 medium training tasks for 10 epochs, batches of 16 tasks with 8 rollouts each,
# staleness at most 3, temperature 1, 512-token completions, a 40k context, CISPO, and Adam with weight decay 0.017
# and the gradient norm clipped at 1. A rank-32 LoRA on Tinker replaces the paper's full fine-tuning, so the learning
# rate is 3e-5, the rate of the paper's Tinker runs, ten times that of its full fine-tuning.

train:
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct
  context_window_length: 40000
  lora_rank: 32
  batch_size: 16
  num_epochs: 10
  num_minibatches: 1
  # One microbatch per batch: platoon weights depth levels and normalizes the loss per microbatch, and the paper's
  # trainer did both over the whole batch.
  num_microbatches: 1
  max_staleness: 3
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 3.0e-5
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    weight_decay: 0.017
    grad_clip_norm: 1.0
  workflow_config:
    group_size: 8
    rollout_isolation: inprocess  # `process` runs each rollout in its own worker
    rollout_config:
      timeout: 7200
      step_timeout: 7200
      verbose: true
      inference_params:
        temperature: 1.0
        max_completion_tokens: 512

eval:
  every: 5
  max_concurrent_rollouts: 32
  workflow_config:  # one rollout per task, with training's rollout settings but its logging
    rollout_config:
      verbose: false

checkpoint:
  every: 25
  recovery_every: 5

log_path: ./logs/runs
tinker_base_url: null

watchdog:
  timeout_seconds: 7200

stats:
  experiment_name: rao-textcraft-synth
  wandb:
    mode: online              # needs WANDB_API_KEY; stats.wandb.mode=disabled turns it off
    project: rao-textcraft-synth
