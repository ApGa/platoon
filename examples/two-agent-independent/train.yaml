# Two agents, two policies, each stepping on its own clock, on the subagents example's Vault tasks: the delegator (the
# root agent) samples main, the quickstart-size Qwen3-4B that train: declares, and every subagent it spawns (role
# subagent) samples a second policy, worker. Unlike ../two-agent-lockstep, the two do not step together: each takes its
# own batch of its rows of the groups, and steps, publishes and saves on its own clock. From the repository root:
#
#   export PYTHONPATH=$PWD/examples/subagents
#   uv run platoon train examples/two-agent-independent/train.yaml           # needs TINKER_API_KEY
#
# The worker names no tinker_base_url, so it trains on the run's service, beside main, in a Tinker session of its own;
# policies.worker.tinker_base_url=... gives it a service of its own.

extends: ../subagents/subagents.yaml

train:
  stepping: independent           # each trained policy on its own clock (default: lockstep)
  batch_size: 8                   # main's batch: its rows of 8 groups a step
  max_staleness: 1                # main's bound: a horizon of (1 + 1) x 8 = 16 groups

policies:
  worker:                         # trainable (the default)
    model_name: Qwen/Qwen3-4B-Instruct-2507
    renderer_name: qwen3_instruct
    lora_rank: 16                 # its own adapter
    optimizer: {learning_rate: 1.0e-5}   # its own optimizer; its loss is train.loss_fn's
    batch_size: 2                 # its rows of 2 groups a step: about 4 of its steps for each of main's
    max_staleness: 7              # its versions age 4 times as fast: a horizon of (7 + 1) x 2 = 16, main's
    checkpoint: {recovery_every: 4}   # a full save, a commit, at every 4th of its own steps

agents:
  roles:
    subagent: {policy: worker}    # the agents the delegator spawns (ctx.agents.spawn's default role)

checkpoint:
  recovery_every: 1               # main's full save, a commit, at each of its steps

stats:
  trial_name: delegator-and-worker-independent
