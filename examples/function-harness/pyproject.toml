# Package the harness so that any platoon install finds it by name, with no `package:` in the config.
#
#   uv pip install -e examples/function-harness
#   uv run platoon harness list        # lists example-tool-loop@1

[project]
name = "example-tool-loop"
version = "0.1.0"
description = "A minimal platoon function harness."
requires-python = ">=3.12"
dependencies = ["platoon >= 0.5, < 0.6"]  # one minor release: below 1.0, a minor release may break it

# The platoon.harnesses group: each entry names a module of @pt.harness functions (importing it registers
# them), a TOML spec file or directory, or a decorated function.
[project.entry-points."platoon.harnesses"]
example-tool-loop = "tool_loop"

[tool.uv.sources]
platoon = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tool_loop.py"]
