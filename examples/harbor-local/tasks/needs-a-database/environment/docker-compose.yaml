# A sidecar database next to Harbor's main container. platoon cannot run multi-container tasks yet, so it
# refuses this task instead of starting main alone, where the verifier would score 0 for a policy that may
# have done the task.
services:
  main:
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
