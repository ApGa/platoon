# A sidecar database next to Harbor's main container. platoon runs a multi-container task only on a sandbox
# provider that runs stacks, and only once it knows each service's command; it refuses this task instead of starting
# main alone, where the verifier would score 0 for a policy that may have done the task. Docker runs stacks, but
# postgres:16 runs its image's command here, which platoon does not record yet.
services:
  main:
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/app
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
