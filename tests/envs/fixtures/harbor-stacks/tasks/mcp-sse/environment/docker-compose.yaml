# Written for platoon, after Harbor's hello-mcp: an MCP sidecar, served over the legacy SSE transport (Harbor's
# default for task servers), whose get_secret tool answers the secret that the agents must write to /app/secret.txt.
services:
  main:
    environment:
      MCP_URL: http://mcp-server:8000/sse
    depends_on:
      mcp-server:
        condition: service_healthy
  mcp-server:
    image: python:3.12-slim
    command: ["python3", "/srv/mcp/server.py", "--transport", "sse"]
    expose:
      - "8000"
    volumes:
      - ./mcp:/srv/mcp:ro
    healthcheck:
      test: ["CMD", "python3", "/srv/mcp/health.py", "http://mcp-server:8000/"]
      interval: 100ms
      timeout: 5s
      retries: 100
