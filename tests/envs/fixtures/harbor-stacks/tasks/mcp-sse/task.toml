version = "1.0"

[task]
name = "platoon/mcp-sse"

[agent]
timeout_sec = 60.0

[verifier]
timeout_sec = 30.0

[environment]
docker_image = "python:3.12-slim"
workdir = "/app"
cpus = 1
memory_mb = 512

[[environment.mcp_servers]]
name = "mcp-server"
transport = "sse"
url = "http://mcp-server:8000/sse"
