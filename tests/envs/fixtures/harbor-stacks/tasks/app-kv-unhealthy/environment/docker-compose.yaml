# Written for platoon: app-kv, with a healthcheck that asks the key-value sidecar for a key it never holds, so the
# sidecar never turns healthy and the stack never starts.
services:
  main:
    environment:
      KV_URL: http://kv:6379
    depends_on:
      kv:
        condition: service_healthy
  kv:
    image: python:3.12-slim
    command: ["python3", "/srv/kv/kv.py"]
    expose:
      - "6379"
    volumes:
      - ./kv:/srv/kv:ro
      - kv-data:/var/lib/kv
      - ${HOST_VERIFIER_LOGS_PATH}:${ENV_VERIFIER_LOGS_PATH}
    healthcheck:
      test: ["CMD", "python3", "/srv/kv/health.py", "http://kv:6379/never-written"]
      interval: 50ms
      timeout: 5s
      retries: 3
volumes:
  kv-data:
