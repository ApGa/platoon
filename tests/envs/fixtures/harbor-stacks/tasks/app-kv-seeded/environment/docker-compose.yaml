# Written for platoon: an init job (seed) stores a greeting in the key-value sidecar once it is healthy, and main
# starts once the job has completed successfully.
services:
  main:
    environment:
      KV_URL: http://kv:6379
    depends_on:
      seed:
        condition: service_completed_successfully
  seed:
    image: python:3.12-slim
    command: ["python3", "/srv/kv/seed.py", "greeting", "hello from the seed"]
    environment:
      KV_URL: http://kv:6379
    volumes:
      - ./kv:/srv/kv:ro
    depends_on:
      kv:
        condition: service_healthy
  kv:
    image: python:3.12-slim
    command: ["python3", "/srv/kv/kv.py"]
    expose:
      - "6379"
    volumes:
      - ./kv:/srv/kv:ro
      - kv-data:/var/lib/kv
      - ${HOST_VERIFIER_LOGS_PATH}:${ENV_VERIFIER_LOGS_PATH}
    healthcheck:
      test: ["CMD", "python3", "/srv/kv/health.py", "http://kv:6379/"]
      interval: 100ms
      timeout: 5s
      retries: 100
volumes:
  kv-data:
