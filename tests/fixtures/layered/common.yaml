# A frozen layered training config for tests/test_config.py: what the RAO recipe's arms share
# (recipes/rao/textcraft-synth/common.yaml when the arms spelled out their environment), without W&B.

train:
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct
  context_window_length: 40000
  lora_rank: 32
  batch_size: 16
  num_epochs: 10
  num_minibatches: 1
  num_microbatches: 2
  max_staleness: 3
  loss_fn: cispo
  loss_fn_config:
    clip_low_threshold: 0.0
    clip_high_threshold: 5.0
  optimizer:
    learning_rate: 3.0e-5
    beta1: 0.9
    beta2: 0.95
    eps: 1.0e-8
    grad_clip_norm: 1.0e+12  # report the gradient norm without clipping
  max_concurrent_rollouts: 128  # 16 groups of 8
  workflow_config:
    group_size: 8
    leave_one_out_baseline: true
    rollout_isolation: inprocess  # `process` runs each rollout in its own worker
    rollout_config:
      max_steps: 200
      timeout: 7200
      step_timeout: 7200
      verbose: true
      inference_params:
        temperature: 1.0
        max_completion_tokens: 512

eval:
  every: 5
  max_concurrent_rollouts: 32
  workflow_config:
    group_size: 1
    filter_errors: false
    filter_zero_advantage_datums: false
    rollout_config:
      max_steps: 200
      timeout: 7200
      step_timeout: 7200
      verbose: false
      inference_params:
        temperature: 1.0
        max_completion_tokens: 512

checkpoint:
  every: 25
  recovery_every: 5

log_path: ./logs/runs
tinker_base_url: null

watchdog:
  timeout_seconds: 7200

stats:
  experiment_name: layered
  wandb:
    mode: disabled
