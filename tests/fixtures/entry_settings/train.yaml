# A mixture of a quick environment, with a calibrated step budget, and a slow one, whose groups take hours: each
# entry sets the training settings of its own groups (tests/test_cli_entry_settings.py).
train:
  model_name: Qwen/Qwen3-4B-Instruct-2507
  renderer_name: qwen3_instruct
  batch_size: 20
  max_training_steps: 60
  max_staleness: 3
  rollout_group_limits: {slow-tasks: 1}
  workflow_config:
    group_size: 8
    min_successful_group_size: 4
    rollout_config:
      max_steps: 200
      timeout: 3600
      inference_params: {temperature: 1.0, max_completion_tokens: 49152}
checkpoint: {recovery_every: 10, keep_recovery: 5}
eval:
  every: 10
  workflow_config: {group_size: 4}
log_path: runs
environments:
  - name: quick-tasks
    service: harbor
    service_kwargs:
      dataset: hf://my-org/quick-tasks@3f1c0e9b6d2a4c8e9f0a1b2c3d4e5f6a7b8c9d0e
      holdout: {fraction: 0.2, group_by: experiment_group}
    harness: openhands
    weight: tasks
    workflow_config:
      rollout_config: {max_steps: 30}
  - name: slow-tasks
    service: harbor
    service_kwargs:
      dataset: hf://my-org/slow-tasks@0d9c8b7a6f5e4d3c2b1a0f9e8d7c6b5a4e3d2c1b
    harness: openhands
    harness_options: {condenser: llm_summarizing}
    weight: tasks
    max_staleness: 48
    workflow_config:
      group_size: 4
      min_successful_group_size: 3
      leave_one_out_baseline: true
      straggler_timeout_seconds: null
      rollout_config:
        max_steps: null
        timeout: null
    eval_overrides:
      workflow_config: {group_size: 1}
