[project]
name = "platoon"
# The release version, set here and nowhere else: platoon.__version__, `platoon --version` and lock.json read it from
# this file in a checkout and from the installed metadata otherwise (CONTRIBUTING.md, "Release a version").
version = "0.2.1"
description = "Build and train systems of agents."
authors = [
    {name = "Apurva Gandhi", email = "apurvag@cs.cmu.edu"}
]
# PyPI shows README.md with its relative links and images pointed at the repository (fancy-pypi-readme, below).
dynamic = ["readme"]
# The tool-call parsers follow SGLang's, which are Apache-2.0 (platoon/train/tinker/renderers/tool_parsers/NOTICE).
license = "MIT AND Apache-2.0"
license-files = [
    "LICENSE",
    "platoon/train/tinker/renderers/tool_parsers/LICENSE-APACHE-2.0",
    "platoon/train/tinker/renderers/tool_parsers/NOTICE",
]
requires-python = ">=3.12"
keywords = [
    "agents",
    "llm",
    "multi-agent",
    "reinforcement-learning",
    "rl",
    "subagents",
    "tinker",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Each one is imported by platoon itself, but dill, which datasets hashes with (tests/test_packaging.py checks both
# ways); what only the tests or the examples import is in the dev group. A lower bound is the oldest release platoon
# works with: the tests pass on the lowest versions these requirements admit (CONTRIBUTING.md, "What the distribution
# holds").
dependencies = [
    "aiohttp>=3.9",
    "cyclopts>=5",
    "datasets>=2.21",  # Dataset.batch, which the trainer's dataloader calls, is new in 2.21
    "datasets>=4.4; python_version >= '3.14'",  # on 3.14, earlier releases' pickler cannot hash a dataset
    # datasets admits dill 0.3 on 3.14 too, whose pickler cannot hash a dataset there: pip would keep an installed one
    "dill>=0.4; python_version >= '3.14'",
    "huggingface-hub>=0.25",  # hf:// Harbor datasets (platoon/envs/harbor/fetch.py); 0.25 has the errors it reads
    "ipython>=9.4.0",
    "jinja2>=3.1",  # transformers renders chat templates only with 3.1+, and 2.x no longer imports
    "packaging>=24",  # reads extensions' requirements on platoon (platoon.extensions)
    "pydantic>=2",
    "pyyaml",
    "rich>=13.9.4",
    "textual>=5.3.0",
    "traitlets",  # the CodeAct executor configures its IPython shells with it
    "wandb>=0.19.0",
]

[project.optional-dependencies]
# HPC task sandboxes: the singularity and enroot providers adapt hpc-sandbox (platoon/sandbox/hpc.py), and rely on the
# working-directory errors, download reports and image cache of its 0.2, the root filesystem layouts of 0.3 and the
# fakeroot option of 0.4, with which Harbor verifiers run as root on Singularity. The lower bound is 0.4.0, the release
# they are tested against, so that an environment that holds an older hpc-sandbox upgrades instead of keeping it: with
# 0.3.0, which has no fakeroot, a run refuses those verifiers when it lists its tasks (platoon/sandbox/singularity.py).
hpc = [
    "hpc-sandbox>=0.4.0,<0.5",
]
# ORS-native environments (python:// and ors+http:// services); 0.1.125 and 0.1.163 are both supported. structlog
# (which openreward requires) quiets the SDK's loggers (platoon/envs/ors/sdk.py), which needs 25.1's
# get_effective_level: with an older structlog, the SDK's INFO lines reach a CodeAct agent's cell output.
ors = [
    "openreward>=0.1.125",
    "structlog>=25.1",
]
# The Tinker SDK and tinker-cookbook, for training, evaluation, the model gateway and platoon.testing. tinker-cookbook
# stays below 0.4: 0.4.0 made Renderer.parse_response return a ParseTermination where the gateway reads a bool, and
# 0.4.2 and later need tinker>=0.22.3 (the SDK upgrade, RFC 0006). The trainer, the renderers and the testing kit's
# toy tokenizer import torch, transformers and tokenizers themselves (tinker and tinker-cookbook require them too).
tinker = [
    "tinker==0.16.1",
    "tinker-cookbook>=0.3.0,<0.4",
    "tokenizers",
    "torch",
    "transformers",
]

[project.urls]
Homepage = "https://github.com/ApGa/platoon"
Documentation = "https://github.com/ApGa/platoon/tree/main/docs"
Source = "https://github.com/ApGa/platoon"
Issues = "https://github.com/ApGa/platoon/issues"
Changelog = "https://github.com/ApGa/platoon/blob/main/CHANGELOG.md"

[project.scripts]
platoon = "platoon.cli:main"

[build-system]
# hatchling 1.27 writes PEP 639 license metadata (license and license-files).
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platoon"]

# The sdist holds what builds the wheel: the package, the license files, README.md (the PyPI description) and the
# release notes. Tests, docs, examples, the extensions and the recipes stay in the repository.
[tool.hatch.build.targets.sdist]
only-include = ["platoon", "LICENSE", "README.md", "CHANGELOG.md"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# PyPI cannot resolve README.md's relative links and images: point them at the repository, at the tag of the release
# being built ($HFPR_VERSION is the version; hatch-fancy-pypi-readme 24.1 added it), so that a release's description
# keeps matching its code and docs after main moves on.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?![a-z][a-z0-9+.-]*:|#)([^)\s]+)\)'
replacement = '](https://github.com/ApGa/platoon/blob/v$HFPR_VERSION/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# An in-page link (`#section`) points at the README's section on GitHub, at the release's tag: PyPI's page gives
# headings no anchors to jump to.
pattern = '\]\(#([^)\s]+)\)'
replacement = '](https://github.com/ApGa/platoon/blob/v$HFPR_VERSION/README.md#\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '<img src="(?![a-z][a-z0-9+.-]*:)([^"]+)"'
replacement = '<img src="https://raw.githubusercontent.com/ApGa/platoon/v$HFPR_VERSION/\1"'

[tool.uv.workspace]
# First-party extensions, one distribution each, built and tested with core and locked together (uv.lock). The
# examples are not members: a member's components would register in every developer's environment.
members = ["extensions/*"]

[dependency-groups]
dev = [
    "litellm",  # drives the gateway as litellm-based harnesses do (tests/gateway/test_gateway_server.py)
    "mcp>=1.30",  # MCP client for the tool-plane tests (tests/gateway/test_gateway_mcp.py)
    "mypy>=1.17.0",
    "openai",  # the OpenAI SDK, in the gateway tests and examples/program-reward-shaping's judge
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-xdist>=3.8.0",  # runs the suite in parallel (pytest -n; CONTRIBUTING.md, "Run the tests")
    "ruff>=0.11.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
