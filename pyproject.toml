[project]
name = "platoon"
version = "0.1.0"
description = "Build and train systems of agents."
authors = [
    {name = "Apurva Gandhi", email = "apurvag@cs.cmu.edu"}
]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "ai-rubric>=0.2.4",
    "datasets",
    "fastapi[standard]>=0.115.12",
    "ipython>=9.4.0",
    "litellm",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "rich>=13.9.4",
    "textual>=5.3.0",
    "notebook>=7.4.4",
    "tenacity",
    "tensordict",
    "wandb>=0.19.0",
]

[project.optional-dependencies]
tinker = [
    "tinker==0.16.1",
    "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git@0be951bd38eb83c4363c1d11caddf4388bf05262",
]
# NOTE: areal backend requires uv for installation (not available on PyPI)
# Install with: uv pip install -e ".[areal]"
areal = [
    "areal[cuda]",
    # AReaL HEAD dropped its classic flash-attn (FA2) dependency in favour of
    # flash-attn-4 (used by sglang for inference). transformers' default
    # attn_implementation='flash_attention_2' for the FSDP training path still needs
    # classic FA2, so re-declare it here. It coexists with flash-attn-4 (FA4 only
    # owns flash_attn/cute/*; FA2 owns flash_attn/__init__.py + the FA2 kernels) and
    # is built from sdist via tool.uv.no-build-isolation-package below.
    "flash-attn==2.8.3; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# uv-specific configuration
# These settings are ignored by pip and only apply when using uv
[tool.uv]
# tinker and areal backends are mutually exclusive
conflicts = [
    [
        { extra = "tinker" },
        { extra = "areal" },
    ],
]
override-dependencies = [
    # These mirror AReaL HEAD's own override-dependencies. uv only honours overrides
    # from the *root* project, so AReaL's are ignored when Platoon is the root and must
    # be re-declared here. Plain pins that aren't true conflict overrides live in
    # [project.dependencies] instead (fastapi, datasets, wandb, ...).
    #
    # litellm[proxy] vs sglang 0.5.10.post1 exact pins: litellm needs openai>=2.8.0
    # (sglang pins 2.6.1) and soundfile<0.13 (sglang pins 0.13.1).
    "openai>=2.8.0",
    "soundfile>=0.12.1,<0.13.0",
    # sglang pins torchao==0.9.0 but AReaL needs >=0.15.0 (archon fp8).
    "torchao==0.15.0",
    "flash-attn-4>=4.0.0b4",
    # sglang requires transformers; force AReaL's supported range (resolves to 5.3.0).
    "transformers>=5.0.0,<=5.3.0",
    "nvidia-cudnn-cu12==9.16.0.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # areal pins networkx==3.3 but ai-rubric needs networkx>=3.5.0; force areal's pin.
    "networkx==3.3.0",
    # megatron-bridge needs 0.17.0; conflicts with hydra-core/timm pins.
    "megatron-core==0.17.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "hydra-core==1.4.0.dev1",
    "timm==1.0.16",
    # Optional CUDA-only megatron-bridge deps that don't build / lack wheels on older
    # host kernels. AReaL excludes them from resolution; mirror that.
    #
    # NOTE on transformer-engine: the Megatron backend genuinely needs Transformer
    # Engine at runtime (megatron.bridge unconditionally imports it), but TE's torch
    # bindings (transformer-engine-torch) are sdist-only and DON'T build on the
    # compute nodes here (no CUDA toolkit / ninja -> "crt/host_defines.h not found").
    # Forcing TE into the resolution graph therefore breaks `uv sync` for *every*
    # backend, including FSDP. So we keep it excluded and provide TE via the
    # container / base image for Megatron runs. FSDP runs don't need TE at all:
    # Platoon's Megatron actor import is lazy (see platoon/train/areal/actor.py).
    "transformer-engine; sys_platform == 'never'",
    "nv-grouped-gemm; sys_platform == 'never'",
    "mamba-ssm; sys_platform == 'never'",
    "causal-conv1d; sys_platform == 'never'",
    "nvidia-resiliency-ext; sys_platform == 'never'",
]
no-build-isolation-package = ["flash-attn", "causal-conv1d", "mamba-ssm"]

[tool.uv.sources]
areal = { git = "https://github.com/inclusionAI/AReaL.git", rev = "a0f3dca200074f920195e1ec34558538d9c7642d" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["platoon"]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.11.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
