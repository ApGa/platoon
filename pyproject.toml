[project]
name = "platoon"
version = "0.1.0"
description = "Build and train systems of agents."
authors = [
    {name = "Apurva Gandhi", email = "apurvag@cs.cmu.edu"}
]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "ai-rubric>=0.2.4",
    "datasets",
    "ipython>=9.4.0",
    "litellm",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "rich>=13.9.4",
    "textual>=5.3.0",
    "notebook>=7.4.4",
    "tenacity",
    "tensordict",
]

[project.optional-dependencies]
tinker = [
    "tinker==0.16.1",
    "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git@0be951bd38eb83c4363c1d11caddf4388bf05262",
]
# NOTE: areal backend requires uv for installation (not available on PyPI)
# Install with: uv pip install -e ".[areal]"
areal = [
    "areal[cuda]",
    # Transformer Engine 2.12 can select its cu13 core wheel, which dlopens
    # libcublas.so.13/libcudart.so.13 at import time.
    "nvidia-cublas>=13.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime>=13.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# Logging integrations (optional)
wandb = [
    "wandb>=0.19.0",
]

# uv-specific configuration
# These settings are ignored by pip and only apply when using uv
[tool.uv]
# tinker and areal backends are mutually exclusive
conflicts = [
    [
        { extra = "tinker" },
        { extra = "areal" },
    ],
]
override-dependencies = [
    "fastapi[standard]>=0.115.0",
    "openai==1.99.6",
    "xgrammar==0.1.24",
    "outlines-core==0.1.26",
    "pyarrow==20.0.0",
    "transformers>=5.3.0",
    "datasets==4.3.0",
    "networkx==3.3.0", # This can be removed if ai-rubric pins 3.3.0 or areal relaxes the pin.
    "megatron-core==0.16.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "hydra-core==1.4.0.dev1",
    "nvidia-cudnn-cu12==9.16.0.29; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cublas>=13.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-cuda-runtime>=13.0.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "nvidia-resiliency-ext~=0.4.1",
    "soundfile>=0.12.1,<0.13.0",
    "timm==1.0.16",
]
no-build-isolation-package = ["flash-attn", "causal-conv1d", "mamba-ssm"]

[tool.uv.sources]
areal = { git = "https://github.com/inclusionAI/AReaL.git", rev = "c4f22f2041faf2fedf8437a70c93f9c7861609ad" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["platoon"]

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.11.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
