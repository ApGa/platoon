name: PR title

# A workflow of its own, so that editing a pull request's title or description re-runs only this check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title:
    # As in ci.yml, not in a private copy of the repository.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # CONTRIBUTING.md's form: no scope, and a summary in sentence case without a final period.
          disallowScopes: .+
          subjectPattern: ^[A-Z].*[^.]$
          subjectPatternError: >-
            Write the summary of "{title}" in sentence case without a final period, for example
            "fix: Close ORS sessions when a rollout is cancelled".
          # A squash merge of a single commit suggests that commit's message, not the title, so check it too.
          validateSingleCommit: true
